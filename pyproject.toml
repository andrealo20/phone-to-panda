[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p2p"
version = "0.1.0"
description = "Phone video of my hand, retargeted metrically to a Panda arm in LIBERO"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "opencv-python==4.13.0.92", "mediapipe", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
